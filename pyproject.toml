[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycasa"
dynamic = ["version"]
description = "Cross-platform 1:1 Python re-implementation of Google Picasa 3 (v3.9.141.259) with 100% binary DB & .picasa.ini compatibility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
]

[tool.setuptools.dynamic]
version = {attr = "picasa_py.version.__version__"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]
fast = [
    "numba>=0.59.0",
]

[project.gui-scripts]
pycasa = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
python_files = ["test_*.py"]
