# FR: Workflow GitHub Actions de compilation multi-OS (Windows, macOS, Linux) de l'exécutable autonome PyCasa
# avec l'icône officielle Picasa 3 (group_icon_105.ico / .icns / .png).
# EN: GitHub Actions multi-OS workflow (Windows, macOS, Linux) building the standalone PyCasa executable
# with the official Picasa 3 icon (group_icon_105.ico / .icns / .png).

name: Build Standalone Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PyCasa (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: PyCasa-Windows-x64
            asset_path: |
              dist/PyCasa.exe
              dist/PyCasa-*-Windows-x64.zip
          - os: macos-latest
            artifact_name: PyCasa-macOS-App
            asset_path: dist/PyCasa-macOS.zip
          - os: ubuntu-latest
            artifact_name: PyCasa-Linux-x64
            asset_path: |
              dist/PyCasa
              dist/PyCasa.png
              dist/PyCasa.desktop
              dist/PyCasa-Linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux system dependencies for Qt / PySide6
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libdbus-1-3

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller PySide6 Pillow numpy

      - name: Build standalone executable with Picasa 3 icon
        run: |
          python tools/build_executable.py

      - name: Package macOS .app archive
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent PyCasa.app PyCasa-macOS.zip

      - name: Package Linux .tar.gz archive
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czvf PyCasa-Linux-x64.tar.gz PyCasa PyCasa.png PyCasa.desktop

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built OS artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release and attach Windows, macOS & Linux binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_assets/PyCasa.exe
            release_assets/PyCasa-*-Windows-x64.zip
            release_assets/PyCasa-macOS.zip
            release_assets/PyCasa-Linux-x64.tar.gz
